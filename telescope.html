<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Telescope</title>
<link rel="stylesheet" href="telescope.css" />
</head>
<body>
  <div class="view" id="view">
    <canvas id="sky" width="480" height="480"></canvas>
    <div class="controls">
      <button id="zoomOut" aria-label="Zoom out">−</button>
      <span class="zoom" id="zoom">×1.0</span>
      <button id="zoomIn" aria-label="Zoom in">+</button>
    </div>
  </div>

  <script src="telescope.js"></script>
</body>
</html>
