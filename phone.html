<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Phone</title>
<link rel="stylesheet" href="phone.css" />
<link rel="stylesheet" href="window.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main class="stage">

  <!-- 左：手机屏幕 -->


<section class="phone" aria-label="Phone">
  <div class="phone-shell"></div>
    <div class="phone-body">
      <span class="earpiece" aria-hidden="true"></span>

      <div class="lcd-frame">
        <div class="lcd" aria-live="polite">
          <div class="status" aria-hidden="true">
            <span class="sig"><i></i><i></i><i></i><i></i></span>
            <span class="bat"><i></i><i></i><i></i></span>
          </div>
          <div class="view" id="view"></div>
          <div class="soft"><span id="soft-l"></span><span id="soft-r"></span></div>
        </div>
      </div>

      <span class="hinge" aria-hidden="true"></span>
    </div>
  </section>


 

  <!-- 右：手机键盘特写（从左上方斜着看，可以点） -->
  <div class="win keyboard-window"
    style="--u: 1px;
       left: calc(var(--px) * 190);
       top: calc(var(--px) * 24);
       --w: calc(var(--px) * 128 + 6px);
       --h: calc(var(--px) * 147 + 24px);">

  <div class="win-title">
    <span class="win-icon"></span>

    <span class="win-btns">
      <button class="win-btn min" aria-label="Minimize"></button>
      <button class="win-btn max" aria-label="Maximize"></button>
      <button class="win-btn close" aria-label="Close"></button>
    </span>
  </div>

  <div class="win-body">
    <div class="win-content">
      <canvas
        id="keypad"
        class="keypad-scene"
        width="150"
        height="172"
        aria-label="Phone keypad">
      </canvas>
    </div>
  </div>
</div>

</main>

<script src="keypad.js"></script>
<script src="phone.js"></script>
<script src="starfield.js"></script>
</body>
</html>
